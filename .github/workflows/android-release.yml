name: Android build & release

on:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create from this commit (e.g. v1.1.0). Leave empty to only build."
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # With KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD repository secrets (key alias "upload") the
      # release build is signed with your key, so later releases install over earlier ones. Without them
      # the APK is signed with a freshly generated debug key (fine for sideloading, but a later release
      # signed with a different key must be installed after uninstalling the old one).
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist && cp app/build/outputs/apk/release/*.apk dist/

      - name: Build debug-signed APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ./gradlew --no-daemon :app:assembleDebug
          mkdir -p dist && cp app/build/outputs/apk/debug/*.apk dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          # A pushed tag already exists; a manual run creates the tag on this commit when the release is made.
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG_FLAG="--target $GITHUB_SHA"; else TAG_FLAG="--verify-tag"; fi
          APK="LocalDocFinder-${TAG}.apk"
          cp dist/*.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" "$APK" "$APK.sha256" $TAG_FLAG --title "LocalDoc Finder ${TAG}" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" "$APK.sha256" $TAG_FLAG --title "LocalDoc Finder ${TAG}" --generate-notes
          fi
