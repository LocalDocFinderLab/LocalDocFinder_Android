name: Android build & release

on:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create from this commit (e.g. v1.1.0). Leave empty to only build."
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    # Branch pushes only run the unit tests; APKs are built (and smoke-tested) for releases and manual runs.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # With KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD repository secrets (key alias "upload") the
      # release build is signed with your key, so later releases install over earlier ones. Without them
      # it is signed with a freshly generated debug key (fine for sideloading, but a later release
      # signed with a different key must be installed after uninstalling the old one).
      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APKs (prod + dev, shrunk, one per processor type + universal)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "Signing with the release key"
          else
            unset STORE_PASSWORD KEY_PASSWORD
            echo "::warning::No signing secrets: signing with a temporary debug key"
          fi
          ./gradlew --no-daemon :app:assembleProdRelease :app:assembleDevRelease
          mkdir -p dist
          # prod: LocalDocFinder-<abi>.apk    dev (developer console, sample-data tools): one universal APK only,
          # LocalDocFinder-dev-universal.apk, so testers never have to pick a processor type
          for f in app/build/outputs/apk/prod/release/app-prod-*-release.apk; do
            abi="$(basename "$f" | sed -E 's/^app-prod-(.*)-release\.apk$/\1/')"
            cp "$f" "dist/LocalDocFinder-$abi.apk"
          done
          cp app/build/outputs/apk/dev/release/app-dev-universal-release.apk dist/LocalDocFinder-dev-universal.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  smoke-test:
    name: Smoke test on emulator
    # Branch pushes only run the unit tests; APKs are built (and smoke-tested) for releases and manual runs.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke-test.sh dist/LocalDocFinder-x86_64.apk

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - run: ./gradlew --no-daemon :app:testProdDebugUnitTest :app:testDevDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          # A pushed tag already exists; a manual run creates the tag on this commit when the release is made.
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG_FLAG="--target $GITHUB_SHA"; else TAG_FLAG="--verify-tag"; fi
          mkdir -p out
          # prod APKs keep their names (LocalDocFinder-<tag>-<abi>.apk); the dev one becomes LocalDocFinder-<tag>-dev-universal.apk
          for f in dist/LocalDocFinder-*.apk; do
            abi="${f#dist/LocalDocFinder-}"; abi="${abi%.apk}"
            cp "$f" "out/LocalDocFinder-${TAG}-${abi}.apk"
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then NOTE_FLAGS=(--notes-file "$NOTES"); else NOTE_FLAGS=(--generate-notes); fi
          # Older app versions download the FIRST .apk of a release, so the universal APK (runs on every
          # phone) is attached on its own first; the per-processor APKs are added after it.
          UNIVERSAL="out/LocalDocFinder-${TAG}-universal.apk"
          gh release create "$TAG" "$UNIVERSAL" $TAG_FLAG --title "LocalDoc Finder ${TAG}" "${NOTE_FLAGS[@]}"
          for abi in arm64-v8a armeabi-v7a x86_64 dev-universal; do
            gh release upload "$TAG" "out/LocalDocFinder-${TAG}-${abi}.apk"
          done
          gh release upload "$TAG" out/SHA256SUMS.txt
